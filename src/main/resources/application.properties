# 1. 应用名称和端口
spring.application.name=preschool-edu
server.port=8080

# ==========================================
# 2. 数据库连接配置
# ==========================================
# 生产环境建议使用环境变量: 
# export DB_PASSWORD=your_password 或在启动时使用 -Dspring.datasource.password=your_password
spring.datasource.url=jdbc:mysql://localhost:3306/preschool_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# 4. JWT 安全配置
# ==========================================
# 生产环境必须使用环境变量设置 JWT 密钥:
# export JWT_SECRET_KEY=your_secure_random_key_at_least_256_bits
jwt.secret.key=${JWT_SECRET_KEY:preschool-edu-jwt-secret-key-minimum-256-bits-required}
jwt.expiration.ms=604800000

# ==========================================
# 5. DeepSeek AI 配置
# ==========================================
# 生产环境建议使用环境变量: export DEEPSEEK_API_KEY=your_api_key
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.api.key=${DEEPSEEK_API_KEY:}

# 6. 开发环境调试开关
security.allow-anonymous=${SECURITY_ALLOW_ANONYMOUS:true}
